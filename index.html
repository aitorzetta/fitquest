<script>
(function(){
var K="fitquest_state_v1";
var base={active:"aitor",view:"home",xp:0,profiles:{
aitor:{name:"Aitor",emoji:"🧔",start:152.9,weight:152.9,startWaist:140,waist:140,fat:47.7,visceral:26,muscle:76,boss:145,protein:130,steps:5000,sleepGoal:7},
laura:{name:"Laura",emoji:"👩",start:107.8,weight:107.8,startWaist:112,waist:112,fat:52,visceral:21,muscle:48.5,boss:102,protein:100,steps:5000,sleepGoal:7}},
entries:{aitor:[],laura:[]},
quests:{aitor:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0},laura:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0}},
raids:{aitor:[],laura:[]},weighins:{aitor:[],laura:[]},gear:{aitor:{owned:[],equipped:{}},laura:{owned:[],equipped:{}}},chests:{aitor:0,laura:0},raid:{done:0,target:4}};
function clone(o){return JSON.parse(JSON.stringify(o))}
function merge(a,b){Object.keys(b||{}).forEach(function(k){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k])merge(a[k],b[k]);else a[k]=b[k]});return a}
var s;try{s=merge(clone(base),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){s=clone(base)}
if(s.profiles&&s.profiles.aitor&&Number(s.profiles.aitor.protein)===150){s.profiles.aitor.protein=130;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
if(!s.raids)s.raids={aitor:[],laura:[]};
if(!s.weighins)s.weighins={aitor:[],laura:[]};
if(!s.gear)s.gear={aitor:{owned:[],equipped:{}},laura:{owned:[],equipped:{}}};
if(!s.chests)s.chests={aitor:0,laura:0};
["aitor","laura"].forEach(function(k){if(!s.gear[k])s.gear[k]={owned:[],equipped:{}};if(!Array.isArray(s.gear[k].owned))s.gear[k].owned=[];if(!s.gear[k].equipped)s.gear[k].equipped={}});
if(s.raid&&Number(s.raid.done)>0&&!s._raidMigrated){
  for(var ri=0;ri<Number(s.raid.done);ri++)s.raids.aitor.push({date:"",title:"PortAventura",xp:100});
  s._raidMigrated=1;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}
}
function save(){localStorage.setItem(K,JSON.stringify(s))}
function p(){return s.profiles[s.active]}
function es(){return s.entries[s.active]||[]}
function rs(){return (s.raids&&s.raids[s.active])||[]}
function ws(){return (s.weighins&&s.weighins[s.active])||[]}
function latestWeighin(){var a=ws().slice().sort(function(a,b){return b.date.localeCompare(a.date)});return a[0]||null}
function raidCount(){return rs().length}
function raidXp(){return raidCount()*100}

var GEAR=[
{id:"head_start",slot:"head",icon:"🧢",name:"Gorra del Tutorial",rarity:"common",power:1,source:"three",desc:"No da estadísticas reales, pero da +10 a sentirse protagonista."},
{id:"head_walk",slot:"head",icon:"🎩",name:"Sombrero del Caminante",rarity:"common",power:4,source:"raid",desc:"Ha visto más aceras que un repartidor."},
{id:"head_10k",slot:"head",icon:"🪖",name:"Yelmo de los 10K",rarity:"rare",power:10,source:"raid",desc:"Protege de la tentación de decir «ya andaré mañana»."},
{id:"head_boss",slot:"head",icon:"👑",name:"Corona del Boss Caído",rarity:"epic",power:18,source:"boss1",desc:"Solo la lleva quien ha tumbado a su primer Boss."},
{id:"head_titan",slot:"head",icon:"👹",name:"Casco del Titán",rarity:"legendary",power:30,source:"raid",desc:"Nadie sabe por qué pesa tan poco."},

{id:"armor_start",slot:"armor",icon:"👕",name:"Camiseta del Respawn",rarity:"common",power:1,source:"firstday",desc:"Toda aventura empieza con ropa de estar por casa."},
{id:"armor_water",slot:"armor",icon:"🦺",name:"Chaleco Hidratado",rarity:"common",power:4,source:"raid",desc:"Bolsillos imaginarios para botellas imaginarias."},
{id:"armor_const",slot:"armor",icon:"🥋",name:"Coraza de la Constancia",rarity:"rare",power:11,source:"raid",desc:"Hecha con días normales repetidos muchas veces."},
{id:"armor_streak",slot:"armor",icon:"🛡️",name:"Armadura de la Racha x7",rarity:"epic",power:19,source:"streak7",desc:"Siete días seguidos dejan marca."},
{id:"armor_dragon",slot:"armor",icon:"🐲",name:"Coraza del Dragón Cardio",rarity:"legendary",power:31,source:"raid",desc:"Ridículamente épica. Exactamente como debe ser."},

{id:"weapon_start",slot:"weapon",icon:"🥄",name:"Cuchara +1",rarity:"common",power:1,source:"starter",desc:"Daño: poco. Carisma: muchísimo."},
{id:"weapon_bread",slot:"weapon",icon:"🥖",name:"Baguette de Batalla",rarity:"common",power:5,source:"raid",desc:"Crujiente, aerodinámica y totalmente inofensiva."},
{id:"weapon_protein",slot:"weapon",icon:"🗡️",name:"Espada Proteica",rarity:"rare",power:12,source:"raid",desc:"Forjada con pollo, yogur y decisiones razonables."},
{id:"weapon_train",slot:"weapon",icon:"⚔️",name:"Mandoble del Entreno",rarity:"epic",power:20,source:"work10",desc:"Diez entrenamientos para poder levantarla."},
{id:"weapon_boss",slot:"weapon",icon:"🔨",name:"Martillo Rompe-Bosses",rarity:"legendary",power:32,source:"raid",desc:"Para Bosses. No para básculas."},

{id:"boots_start",slot:"boots",icon:"👟",name:"Zapatillas del Primer Paso",rarity:"common",power:1,source:"walk5",desc:"Literalmente hay que empezar por algún sitio."},
{id:"boots_walk",slot:"boots",icon:"🥾",name:"Botas del Paseante",rarity:"common",power:4,source:"raid",desc:"Cómodas incluso después de aparcar lejísimos."},
{id:"boots_10k",slot:"boots",icon:"👞",name:"Botas de los 10.000",rarity:"rare",power:10,source:"raid",desc:"Suela reforzada contra centros comerciales gigantes."},
{id:"boots_20k",slot:"boots",icon:"🛼",name:"Botas Sin Frenos",rarity:"epic",power:21,source:"steps20k",desc:"Se desbloquean cuando caminar ya empieza a ser sospechoso."},
{id:"boots_world",slot:"boots",icon:"🥾",name:"Grebas del Mundo Exterior",rarity:"legendary",power:30,source:"raid",desc:"Tocan césped. A veces incluso montaña."},

{id:"accessory_start",slot:"accessory",icon:"🧴",name:"Botella del Novato",rarity:"common",power:1,source:"protein1",desc:"Objeto inicial. Contiene agua, normalmente."},
{id:"accessory_check",slot:"accessory",icon:"📿",name:"Pulsera del Check-in",rarity:"common",power:4,source:"raid",desc:"Te mira fijamente hasta que registras el día."},
{id:"accessory_protein",slot:"accessory",icon:"💍",name:"Anillo Proteico",rarity:"rare",power:11,source:"raid",desc:"No hace nada. Pero suena tremendamente científico."},
{id:"accessory_sleep",slot:"accessory",icon:"🧿",name:"Amuleto del Sueño Profundo",rarity:"epic",power:18,source:"sleep5",desc:"Cinco descansos decentes. Milagro moderno."},
{id:"accessory_time",slot:"accessory",icon:"⌚",name:"Reloj del Tiempo Ganado",rarity:"legendary",power:31,source:"raid",desc:"Marca siempre la hora de seguir con la aventura."},

{id:"pet_start",slot:"pet",icon:"🐣",name:"Pollo del Tutorial",rarity:"common",power:1,source:"raid1",desc:"No sabe qué hace aquí, pero te apoya."},
{id:"pet_snail",slot:"pet",icon:"🐌",name:"Paco el Caracol",rarity:"common",power:3,source:"raid",desc:"Va lento. Sigue llegando."},
{id:"pet_dog",slot:"pet",icon:"🐕",name:"Guardián de las Rutas",rarity:"rare",power:10,source:"raid",desc:"Especialista en elegir el camino más largo."},
{id:"pet_fox",slot:"pet",icon:"🦊",name:"Zorro de las Cinco Raids",rarity:"epic",power:20,source:"raid5",desc:"Aparece cuando ya esto empieza a parecer una campaña."},
{id:"pet_dragon",slot:"pet",icon:"🐉",name:"Mini Dragón del Respawn",rarity:"legendary",power:35,source:"raid",desc:"Pequeño, legendario y absolutamente innecesario."}
];
var SLOT_NAMES={head:"Cabeza",armor:"Armadura",weapon:"Arma",boots:"Botas",accessory:"Accesorio",pet:"Compañero"};
var RARITY_NAMES={common:"Común",rare:"Raro",epic:"Épico",legendary:"Legendario"};
function gs(){return s.gear[s.active]}
function chestCount(){return Number(s.chests[s.active])||0}
function itemById(id){return GEAR.find(function(i){return i.id===id})||null}
function ownItem(id){return gs().owned.indexOf(id)>=0}
function giveItem(id,autoEquip){
  if(!id||ownItem(id))return false;
  gs().owned.push(id);
  var it=itemById(id);
  if(autoEquip&&it&&!gs().equipped[it.slot])gs().equipped[it.slot]=id;
  return true
}
function initStarterGear(){
  var changed=false,starter=itemById("weapon_start");
  if(!s._gearProgressionV2){
    ["aitor","laura"].forEach(function(k){
      var g=s.gear[k],remove=["head_start","armor_start","boots_start","accessory_start","pet_start"];
      g.owned=g.owned.filter(function(id){return remove.indexOf(id)<0});
      Object.keys(g.equipped).forEach(function(slot){if(remove.indexOf(g.equipped[slot])>=0)delete g.equipped[slot]})
    });
    s._gearProgressionV2=1;changed=true
  }
  ["aitor","laura"].forEach(function(k){
    var g=s.gear[k];
    if(g.owned.indexOf(starter.id)<0){g.owned.push(starter.id);changed=true}
    if(!g.equipped.weapon){g.equipped.weapon=starter.id;changed=true}
  });
  if(changed)save()
}
function gearPower(){return Object.keys(gs().equipped).reduce(function(a,k){var it=itemById(gs().equipped[k]);return a+(it?it.power:0)},0)}
function sourceLabel(i){
  if(i.source==="starter")return "Equipo inicial";
  if(i.source==="firstday")return "Registra tu primer día";
  if(i.source==="three")return "Registra 3 días";
  if(i.source==="walk5")return "Llega a 5.000 pasos";
  if(i.source==="protein1")return "Cumple proteína un día";
  if(i.source==="raid1")return "Completa tu primera Raid";
  if(i.source==="raid")return "Botín de Raid";
  if(i.source==="boss1")return "Derrota al Boss I";
  if(i.source==="streak7")return "Racha de 7 días";
  if(i.source==="work10")return "10 entrenamientos";
  if(i.source==="steps20k")return "20.000 pasos en un día";
  if(i.source==="sleep5")return "5 días cumpliendo sueño";
  if(i.source==="raid5")return "Completa 5 Raids";
  return "Desconocido"
}
function refreshSpecialGear(){
  var changed=false;
  if(registeredDays()>=1)changed=giveItem("armor_start",false)||changed;
  if(registeredDays()>=3)changed=giveItem("head_start",false)||changed;
  if(maxSteps()>=5000)changed=giveItem("boots_start",false)||changed;
  if(proteinGoalDays()>=1)changed=giveItem("accessory_start",false)||changed;
  if(raidCount()>=1)changed=giveItem("pet_start",false)||changed;
  if(p().weight<=p().boss)changed=giveItem("head_boss",false)||changed;
  if(longestStreak()>=7)changed=giveItem("armor_streak",false)||changed;
  if(workoutCount()>=10)changed=giveItem("weapon_train",false)||changed;
  if(maxSteps()>=20000)changed=giveItem("boots_20k",false)||changed;
  if(sleepGoalDays()>=5)changed=giveItem("accessory_sleep",false)||changed;
  if(raidCount()>=5)changed=giveItem("pet_fox",false)||changed;
  if(changed)save()
}
function characterRank(){
  var pw=gearPower();
  return pw>=100?"LEGENDARIO":pw>=60?"ÉLITE":pw>=30?"VETERANO":pw>=10?"AVENTURERO":"NOVATO"
}
function gearVisual(slot,it){
  if(!it)return "";
  var src="assets/gear/"+s.active+"/"+it.id+".webp";
  return '<div class="gearVisual '+slot+'"><span class="gearMarker">'+it.icon+'</span><img class="gearLayer" src="'+src+'" alt="" onload="this.previousElementSibling.style.display=\'none\'" onerror="this.style.display=\'none\'"></div>'
}
function avatarVisual(){

var form=document.getElementById("form"),mealsBox=document.getElementById("meals"),mealSummary=document.getElementById("mealSummary"),addMeal=document.getElementById("addMeal");

function importHealthFromUrl(){
  try{
    var raw=location.hash&&location.hash.indexOf("#fq=")===0?location.hash.slice(1):location.search.slice(1);
    var q=new URLSearchParams(raw);
    if(q.get("fq")!=="health")return false;
    var who=q.get("profile")==="laura"?"laura":"aitor";
    s.active=who;
    var d=new Date(),date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var rawSteps=q.get("steps"),rawSleep=q.get("sleep");
    var steps=rawSteps==null||rawSteps===""?null:Number(String(rawSteps).replace(/[^0-9]/g,""));
    var sleep=rawSleep==null||rawSleep===""?null:Number(String(rawSleep).replace(",","."));
    var arr=s.entries[who]||(s.entries[who]=[]);
    var i=arr.findIndex(function(v){return v.date===date});
    var o=i>=0?arr[i]:{date:date,weight:null,waist:null,protein:null,calories:null,meals:[],steps:null,sleep:null,hunger:null,energy:null,training:"",notes:""};
    if(Number.isFinite(steps))o.steps=Math.max(0,Math.round(steps));
    if(Number.isFinite(sleep))o.sleep=Math.max(0,Math.round(sleep*100)/100);
    if(i>=0)arr[i]=o;else arr.push(o);
    save();
    try{history.replaceState({},"",location.pathname)}catch(e){}
    return true;
  }catch(e){return false}
}
function n(v){return v===""?null:Number(v)}
