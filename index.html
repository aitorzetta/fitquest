<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>FitQuest</title>
<style>
:root{--bg:#0b1020;--p:#182238;--p2:#101729;--t:#f7f8fb;--m:#9aa7bd;--l:#2a3650;--a:#7c5cff;--g:#18c79c;--w:#ffbd4a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17213c,#0b1020 45%,#080c17);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.wrap{max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:5;padding:20px 16px 8px;background:linear-gradient(#0b1020 70%,transparent)}h1{margin:0;font-size:30px}.ey{font-size:11px;color:var(--g);font-weight:800;letter-spacing:2px}.switch,.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{padding:8px 16px 12px}.switch button,.nav button,.btn,.q{border:0;font:inherit}.switch button{padding:12px;border-radius:16px;background:var(--p2);color:var(--m);font-weight:800;border:1px solid var(--l)}.switch button.on{background:linear-gradient(135deg,#6d53ef,#8f74ff);color:#fff}.main{padding:4px 16px}.card{background:linear-gradient(180deg,#182238,#111828);border:1px solid var(--l);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 14px 30px #0004}.hero{background:linear-gradient(135deg,#7c5cff48,#18c79c26,#182238)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.big{font-size:38px;font-weight:900}.muted{color:var(--m)}.mini{font-size:12px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#0e1626;border:1px solid var(--l);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric b{display:block;font-size:23px;margin-top:4px}.bar{height:12px;background:#0d1424;border:1px solid var(--l);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}.sec{font-size:19px;margin:22px 2px 8px}.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--l);border-radius:15px;background:#0e1626;margin:8px 0}.q{padding:9px 11px;border-radius:11px;background:#24314c;color:#dce4f3;font-weight:800}.q.done{background:#163a31;color:#7df0ba}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);grid-template-columns:repeat(5,1fr);background:#090e1bf2;border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:8}.nav button{background:transparent;color:#8492aa;border-radius:12px;padding:7px 2px;font-size:11px}.nav button.on{background:#151e31;color:#fff}.nav span{display:block;font-size:20px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--m);font-weight:800}.field input,.field textarea,.field select{background:#0c1322;color:#fff;border:1px solid var(--l);border-radius:13px;padding:12px;font:inherit;width:100%}.field textarea{min-height:80px}.btn{padding:12px 15px;border-radius:13px;background:linear-gradient(135deg,var(--a),#9c7cff);color:white;font-weight:900}.btn.alt{background:#172238;border:1px solid var(--l)}.hist{padding:11px;border:1px solid var(--l);border-radius:14px;background:#0e1626;margin:8px 0}.locked{opacity:.42}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:800;display:none;z-index:20}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="ey">PARTY</div><h1>FitQuest</h1></header>
<div class="switch"><button data-p="aitor" class="on">🧔 Aitor</button><button data-p="laura">👩 Laura</button></div>
<main id="app" class="main"></main>
<nav class="nav">
<button data-v="home" class="on"><span>🏠</span>Inicio</button>
<button data-v="log"><span>➕</span>Registrar</button>
<button data-v="progress"><span>📈</span>Progreso</button>
<button data-v="ach"><span>🏆</span>Logros</button>
<button data-v="settings"><span>⚙️</span>Ajustes</button>
</nav>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
var K="fitquest_state_v1";
var base={active:"aitor",view:"home",xp:0,profiles:{
aitor:{name:"Aitor",emoji:"🧔",start:152.9,weight:152.9,startWaist:140,waist:140,fat:47.7,visceral:26,muscle:76,boss:145,protein:150,steps:5000},
laura:{name:"Laura",emoji:"👩",start:107.8,weight:107.8,startWaist:112,waist:112,fat:52,visceral:21,muscle:48.5,boss:102,protein:100,steps:5000}},
entries:{aitor:[],laura:[]},
quests:{aitor:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0},laura:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0}},
raid:{done:0,target:4}};
function clone(o){return JSON.parse(JSON.stringify(o))}
function merge(a,b){Object.keys(b||{}).forEach(function(k){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k])merge(a[k],b[k]);else a[k]=b[k]});return a}
var s;try{s=merge(clone(base),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){s=clone(base)}
function save(){localStorage.setItem(K,JSON.stringify(s))}
function p(){return s.profiles[s.active]}
function es(){return s.entries[s.active]||[]}
function f(n,d){return Number(n).toFixed(d==null?1:d)}
function xp(){var q=s.quests[s.active];return q.nutrition*40+q.movement*20+q.strength*20+q.sleep*10+q.checkin*10}
function lost(){return Math.max(0,p().start-p().weight)}
function bossPct(){var total=p().start-p().boss;return Math.max(0,Math.min(100,(p().start-p().weight)/total*100))}
function t(msg){var x=document.getElementById("toast");x.textContent=msg;x.style.display="block";setTimeout(function(){x.style.display="none"},1800)}
function qrow(k,label,val){var d=s.quests[s.active][k];return '<div class="quest"><div><b>'+label+'</b><div class="mini muted">'+val+' XP</div></div><button class="q '+(d?'done':'')+'" data-q="'+k+'">'+(d?'✓ Hecho':'Marcar')+'</button></div>'}
function home(){
var x=p(),partyStart=s.profiles.aitor.start+s.profiles.laura.start,partyNow=s.profiles.aitor.weight+s.profiles.laura.weight,left=Math.max(0,x.weight-x.boss);
return '<section class="card hero"><div class="row"><div><div class="ey">'+x.emoji+' '+x.name+' · NIVEL '+(Math.floor(s.xp/500)+1)+'</div><div class="big">'+f(x.weight)+' kg</div><div class="muted">-'+f(lost())+' kg desde el inicio</div></div><span class="badge">🧪 '+xp()+'/100 XP</span></div><div class="bar" style="margin-top:14px"><i style="width:'+((s.xp%500)/5)+'%"></i></div></section>'+
'<h2 class="sec">Boss actual</h2><section class="card"><div class="row"><div><b>👹 Boss I · '+f(x.boss)+' kg</b><div class="mini muted">'+(left?f(left)+' kg restantes':'DERROTADO')+'</div></div><span class="badge">'+f(bossPct(),0)+'%</span></div><div class="bar" style="margin-top:12px"><i style="width:'+bossPct()+'%"></i></div></section>'+
'<h2 class="sec">Stats</h2><div class="grid">'+
'<div class="card metric"><span class="muted mini">CINTURA</span><b>'+f(x.waist,0)+' cm</b></div>'+
'<div class="card metric"><span class="muted mini">GRASA</span><b>'+f(x.fat)+'%</b></div>'+
'<div class="card metric"><span class="muted mini">MÚSCULO</span><b>'+f(x.muscle)+' kg</b></div>'+
'<div class="card metric"><span class="muted mini">VISCERAL</span><b>'+f(x.visceral,0)+'</b></div>'+
'<div class="card metric"><span class="muted mini">PROTEÍNA</span><b>'+f(x.protein,0)+' g</b></div>'+
'<div class="card metric"><span class="muted mini">PASOS</span><b>'+f(x.steps,0)+'</b></div></div>'+
'<h2 class="sec">Quests semanales</h2><section class="card">'+qrow("nutrition","🥗 Alimentación",40)+qrow("movement","🚶 Movimiento",20)+qrow("strength","🏋️ Fuerza",20)+qrow("sleep","😴 Descanso",10)+qrow("checkin","📊 Check-in",10)+'</section>'+
'<h2 class="sec">Evento</h2><section class="card"><div class="row"><div><div class="ey">🎢 RAID</div><b>PortAventura x'+s.raid.target+'</b></div><span class="badge">'+s.raid.done+'/'+s.raid.target+' días</span></div><p class="mini muted">Caminata + bocadillo completo + batido + cena proteica + hidratación.</p><div class="row"><button id="minus" class="btn alt">− Día</button><button id="plus" class="btn">+ Día completado</button></div></section>'+
'<h2 class="sec">Party</h2><section class="card"><div class="row"><div><span class="mini muted">PESO CONJUNTO</span><div class="big" style="font-size:28px">'+f(partyNow)+' kg</div></div><b>-'+f(Math.max(0,partyStart-partyNow))+' kg</b></div></section>'
}
function log(){
var x=p(),arr=es().slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,8);
var hist=arr.length?arr.map(function(e){return '<div class="hist"><div class="row"><b>'+e.date+'</b><b>'+(e.weight?f(e.weight)+' kg':'')+'</b></div><div class="mini muted">'+(e.waist?'📏 '+f(e.waist)+' cm · ':'')+(e.steps?'🚶 '+e.steps+' pasos · ':'')+(e.protein?'🥤 '+e.protein+' g · ':'')+(e.sleep?'😴 '+e.sleep+' h':'')+'</div>'+(e.notes?'<div class="mini" style="margin-top:6px">'+esc(e.notes)+'</div>':'')+'</div>'}).join(""):'<div class="card muted">Todavía no hay check-ins.</div>';
return '<h2 class="sec">Registrar día · '+x.name+'</h2><form id="form" class="card">'+
field("Fecha","date","date",new Date().toISOString().slice(0,10))+
field("Peso (kg)","weight","number","",x.weight,"0.1")+
field("Cintura (cm)","waist","number","",x.waist,"0.1")+
field("Proteína (g)","protein","number","",x.protein,"1")+
field("Pasos","steps","number","","","1")+
field("Sueño (h)","sleep","number","","","0.1")+
field("Hambre 1–10","hunger","number","","","1")+
field("Energía 1–10","energy","number","","","1")+
'<div class="field"><label>Entrenamiento</label><select name="training"><option></option><option>No</option><option>Fuerza</option><option>Cardio</option><option>Mixto</option><option>PortAventura / caminata larga</option></select></div>'+
'<div class="field"><label>Notas</label><textarea name="notes"></textarea></div><button class="btn" type="submit">💾 Guardar check-in</button></form><h2 class="sec">Últimos registros</h2>'+hist
}
function field(label,name,type,val,ph,step){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+(val||"")+'" placeholder="'+(ph||"")+'" '+(step?'step="'+step+'"':'')+'></div>'}
function progress(){var x=p();return '<h2 class="sec">Progreso · '+x.name+'</h2><div class="grid"><div class="card metric"><span class="mini muted">PESO INICIAL</span><b>'+f(x.start)+' kg</b></div><div class="card metric"><span class="mini muted">PESO ACTUAL</span><b>'+f(x.weight)+' kg</b></div><div class="card metric"><span class="mini muted">CINTURA INICIAL</span><b>'+f(x.startWaist,0)+' cm</b></div><div class="card metric"><span class="mini muted">CINTURA ACTUAL</span><b>'+f(x.waist,0)+' cm</b></div></div><section class="card"><div class="row"><span class="muted">Peso perdido</span><b>'+f(lost())+' kg</b></div><hr style="border-color:#2a3650"><div class="row"><span class="muted">Cintura perdida</span><b>'+f(Math.max(0,x.startWaist-x.waist))+' cm</b></div><hr style="border-color:#2a3650"><div class="row"><span class="muted">Boss</span><b>'+f(bossPct(),0)+'%</b></div></section><h2 class="sec">Historial</h2>'+log().split('<h2 class="sec">Últimos registros</h2>')[1]}
function ach(){
var x=p(),wl=lost(),cw=Math.max(0,x.startWaist-x.waist),a=[
["🎬","Comienza la partida","SAVE inicial",1],
["🧱","Romper la barrera",x.name==="Aitor"?"Bajar de 150 kg":"Bajar de 105 kg",x.name==="Aitor"?x.weight<150:x.weight<105],
["👹","Boss I","Llegar a "+x.boss+" kg",x.weight<=x.boss],
["🔟","Doble dígito","Perder 10 kg",wl>=10],
["📏","Cintura -5","Perder 5 cm",cw>=5],
["📐","Cintura -10","Perder 10 cm",cw>=10],
["🏆","Perfect Week","Completar 100 XP",xp()>=100]];
return '<h2 class="sec">Logros · '+x.name+'</h2>'+a.map(function(z){return '<section class="card '+(z[3]?'':'locked')+'"><div class="row"><div><b>'+z[0]+' '+z[1]+'</b><div class="mini muted">'+z[2]+'</div></div><span class="badge">'+(z[3]?'DESBLOQUEADO':'BLOQUEADO')+'</span></div></section>'}).join("")
}
function settings(){
var x=p();return '<h2 class="sec">Ajustes</h2><section class="card">'+field("Boss actual (kg)","boss","number",x.boss,"","0.1")+field("Proteína objetivo (g)","protein","number",x.protein,"","1")+field("Pasos objetivo","steps","number",x.steps,"","100")+'<button id="saveSet" class="btn">Guardar objetivos</button></section><h2 class="sec">Copia de seguridad</h2><section class="card"><div class="row"><button id="export" class="btn alt">Exportar JSON</button><label class="btn alt">Importar JSON<input id="import" type="file" accept="application/json" hidden></label></div><p class="mini muted">Esta V1 guarda los datos en este dispositivo.</p></section>'
}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
function render(){
document.querySelectorAll("[data-p]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-p")===s.active)});
document.querySelectorAll("[data-v]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-v")===s.view)});
var m={home:home,log:log,progress:progress,ach:ach,settings:settings};document.getElementById("app").innerHTML=m[s.view]();
wire()
}
function wire(){
document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-q");s.quests[s.active][k]=s.quests[s.active][k]?0:1;save();render()}});
var plus=document.getElementById("plus"),minus=document.getElementById("minus");if(plus)plus.onclick=function(){s.raid.done=Math.min(s.raid.target,s.raid.done+1);save();render()};if(minus)minus.onclick=function(){s.raid.done=Math.max(0,s.raid.done-1);save();render()};
var form=document.getElementById("form");if(form)form.onsubmit=function(e){e.preventDefault();var d=new FormData(form),o={date:d.get("date"),weight:n(d.get("weight")),waist:n(d.get("waist")),protein:n(d.get("protein")),steps:n(d.get("steps")),sleep:n(d.get("sleep")),hunger:n(d.get("hunger")),energy:n(d.get("energy")),training:d.get("training"),notes:d.get("notes")};var arr=es(),i=arr.findIndex(function(v){return v.date===o.date});if(i>=0)arr[i]=o;else arr.push(o);if(o.weight)p().weight=o.weight;if(o.waist)p().waist=o.waist;s.quests[s.active].checkin=1;save();render();t("Check-in guardado 📊")};
var ss=document.getElementById("saveSet");if(ss)ss.onclick=function(){var d=new FormData(ss.parentElement);p().boss=Number(d.get("boss"))||p().boss;p().protein=Number(d.get("protein"))||p().protein;p().steps=Number(d.get("steps"))||p().steps;save();render();t("Objetivos guardados")};
var ex=document.getElementById("export");if(ex)ex.onclick=function(){var b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="fitquest-backup.json";a.click()};
var im=document.getElementById("import");if(im)im.onchange=function(){var r=new FileReader();r.onload=function(){try{s=merge(clone(base),JSON.parse(r.result));save();render();t("Partida importada ✅")}catch(e){t("Archivo no válido")}};if(im.files[0])r.readAsText(im.files[0])}
}
function n(v){return v===""?null:Number(v)}
document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){s.active=b.getAttribute("data-p");save();render()}});
document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){s.view=b.getAttribute("data-v");save();render()}});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
render()
})();
</script>
</body>
</html>
