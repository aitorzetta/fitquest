<style>
:root{--bg:#0b1020;--p:#182238;--p2:#101729;--t:#f7f8fb;--m:#9aa7bd;--l:#2a3650;--a:#7c5cff;--g:#18c79c;--w:#ffbd4a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17213c,#0b1020 45%,#080c17);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.wrap{max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:5;padding:20px 16px 8px;background:linear-gradient(#0b1020 70%,transparent)}h1{margin:0;font-size:30px}.ey{font-size:11px;color:var(--g);font-weight:800;letter-spacing:2px}.switch,.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{padding:8px 16px 12px}.switch button,.nav button,.btn,.q{border:0;font:inherit}.switch button{padding:12px;border-radius:16px;background:var(--p2);color:var(--m);font-weight:800;border:1px solid var(--l)}.switch button.on{background:linear-gradient(135deg,#6d53ef,#8f74ff);color:#fff}.main{padding:4px 16px}.card{background:linear-gradient(180deg,#182238,#111828);border:1px solid var(--l);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 14px 30px #0004}.hero{background:linear-gradient(135deg,#7c5cff48,#18c79c26,#182238)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.big{font-size:38px;font-weight:900}.muted{color:var(--m)}.mini{font-size:12px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#0e1626;border:1px solid var(--l);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric b{display:block;font-size:23px;margin-top:4px}.bar{height:12px;background:#0d1424;border:1px solid var(--l);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}.xpLine{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:8px}.xpLine b{font-size:13px}.xpSource{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--l)}.xpSource:last-child{border-bottom:0}.sec{font-size:19px;margin:22px 2px 8px}.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--l);border-radius:15px;background:#0e1626;margin:8px 0}.q{padding:9px 11px;border-radius:11px;background:#24314c;color:#dce4f3;font-weight:800}.q.done{background:#163a31;color:#7df0ba}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);grid-template-columns:repeat(5,1fr);background:#090e1bf2;border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:8}.nav button{background:transparent;color:#8492aa;border-radius:12px;padding:7px 2px;font-size:11px}.nav button.on{background:#151e31;color:#fff}.nav span{display:block;font-size:20px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.formSection{margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--l)}.formSection:first-child{border-top:0;padding-top:0}.formTitle{font-weight:900;margin-bottom:6px}.hint{font-size:12px;color:var(--m);line-height:1.35}.mealCard{padding:12px;border:1px solid var(--l);border-radius:16px;background:#0e1626;margin:10px 0}.mealGrid{display:grid;grid-template-columns:90px 1fr;gap:8px}.mealGrid .full{grid-column:1/-1}.mealActions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px}.mealTotal{padding:12px;border-radius:14px;background:#10192b;border:1px solid var(--l);margin-top:10px}.mealTotal b{font-size:20px}.danger{background:#321a22!important;color:#ff9cac!important;border:1px solid #5a2637!important}.field label{font-size:12px;color:var(--m);font-weight:800}.field input,.field textarea,.field select{background:#0c1322;color:#fff;border:1px solid var(--l);border-radius:13px;padding:12px;font:inherit;width:100%}.field textarea{min-height:80px}.btn{padding:12px 15px;border-radius:13px;background:linear-gradient(135deg,var(--a),#9c7cff);color:white;font-weight:900}.btn.alt{background:#172238;border:1px solid var(--l)}.hist{padding:11px;border:1px solid var(--l);border-radius:14px;background:#0e1626;margin:8px 0}.dailyRow{padding:10px 0;border-bottom:1px solid var(--l)}.dailyRow:last-child{border-bottom:0}.dailyTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px}.dailyVal{font-weight:900}.dayCard{padding:13px;border:1px solid var(--l);border-radius:16px;background:#0e1626;margin:8px 0}.ok{color:#7df0ba}.warn{color:#ffd27a}.achSummary{background:linear-gradient(135deg,#7c5cff35,#18c79c20,#182238)}.achGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.achCard{position:relative;margin:0;padding:14px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.achIcon{font-size:29px;margin-bottom:8px}.achCard b{display:block;line-height:1.15}.achMeta{font-size:11px;color:var(--m);margin-top:5px;line-height:1.3}.achCard.locked{opacity:.5}.achCard.hiddenAch{background:linear-gradient(180deg,#111625,#0b101d);border-style:dashed}.achCard.unlocked{box-shadow:0 0 0 1px #18c79c55,0 14px 30px #0004}.achState{margin-top:10px;font-size:10px;font-weight:900;letter-spacing:.8px}.achProgress{height:7px;margin-top:10px}.achCat{font-size:13px;color:var(--m);font-weight:900;text-transform:uppercase;letter-spacing:1.2px;margin:24px 2px 9px}.locked{opacity:.42}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:800;display:none;z-index:20}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.achGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="ey">PARTY</div><h1>FitQuest</h1></header>
<div class="switch"><button data-p="aitor" class="on">🧔 Aitor</button><button data-p="laura">👩 Laura</button></div>
<main id="app" class="main"></main>
<nav class="nav">
<button data-v="home" class="on"><span>🏠</span>Inicio</button>
<button data-v="log"><span>➕</span>Registrar</button>
<button data-v="progress"><span>📈</span>Progreso</button>
<button data-v="ach"><span>🏆</span>Logros</button>
<button data-v="settings"><span>⚙️</span>Ajustes</button>
</nav>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
var K="fitquest_state_v1";
var base={active:"aitor",view:"home",xp:0,profiles:{
aitor:{name:"Aitor",emoji:"🧔",start:152.9,weight:152.9,startWaist:140,waist:140,fat:47.7,visceral:26,muscle:76,boss:145,protein:130,steps:5000,sleepGoal:7},
laura:{name:"Laura",emoji:"👩",start:107.8,weight:107.8,startWaist:112,waist:112,fat:52,visceral:21,muscle:48.5,boss:102,protein:100,steps:5000,sleepGoal:7}},
entries:{aitor:[],laura:[]},
quests:{aitor:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0},laura:{nutrition:0,movement:0,strength:0,sleep:0,checkin:0}},
raid:{done:0,target:4}};
function clone(o){return JSON.parse(JSON.stringify(o))}
function merge(a,b){Object.keys(b||{}).forEach(function(k){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k])merge(a[k],b[k]);else a[k]=b[k]});return a}
var s;try{s=merge(clone(base),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){s=clone(base)}
if(s.profiles&&s.profiles.aitor&&Number(s.profiles.aitor.protein)===150){s.profiles.aitor.protein=130;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
function save(){localStorage.setItem(K,JSON.stringify(s))}
function p(){return s.profiles[s.active]}
function es(){return s.entries[s.active]||[]}
function localDate(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayEntry(){var d=localDate();return es().find(function(e){return e.date===d})||null}
function clampPct(v,g){if(!g)return 0;return Math.max(0,Math.min(100,(Number(v)||0)/g*100))}
function goalRow(icon,label,value,goal,suffix){
  var has=value!==null&&value!==undefined&&value!=="",num=has?Number(value):0,pct=clampPct(num,goal);
  return '<div class="dailyRow"><div class="dailyTop"><span>'+icon+' '+label+'</span><span class="dailyVal '+(has&&num>=goal?'ok':'')+'">'+(has?f(num,label==="Pasos"?0:1):'—')+' / '+f(goal,label==="Pasos"?0:1)+' '+suffix+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'
}

function mealProtein(e){
  if(e&&Array.isArray(e.meals)&&e.meals.length)return e.meals.reduce(function(a,m){return a+(Number(m.protein)||0)},0);
  return e&&e.protein!=null?Number(e.protein):0
}
function mealCalories(e){
  if(e&&Array.isArray(e.meals)&&e.meals.length)return e.meals.reduce(function(a,m){return a+(Number(m.calories)||0)},0);
  return e&&e.calories!=null?Number(e.calories):0
}
function mealCount(e){return e&&Array.isArray(e.meals)?e.meals.length:0}
function mealRowHTML(m){
  m=m||{};
  return '<div class="mealCard mealRow">'+
    '<div class="mealGrid">'+
      '<div class="field"><label>Hora</label><input class="mealTime" type="time" value="'+esc(m.time||"")+'"></div>'+
      '<div class="field"><label>Tipo</label><select class="mealType">'+
        ["🍽️ Comida","🥪 Bocadillo","🥤 Batido","🍎 Snack","🍴 Cena","☕ Desayuno","➕ Otro"].map(function(v){return '<option '+(m.type===v?'selected':'')+'>'+v+'</option>'}).join("")+
      '</select></div>'+
      '<div class="field full"><label>Qué has comido</label><input class="mealName" type="text" placeholder="Ej. bocadillo de pollo, ensalada..." value="'+esc(m.name||"")+'"></div>'+
      '<div class="field"><label>Proteína (g)</label><input class="mealProtein" type="number" step="1" min="0" placeholder="Opcional" value="'+(m.protein==null?"":m.protein)+'"></div>'+
      '<div class="field"><label>Kcal</label><input class="mealCalories" type="number" step="1" min="0" placeholder="Opcional" value="'+(m.calories==null?"":m.calories)+'"></div>'+
    '</div>'+
    '<div class="mealActions"><span class="mini muted">Proteína y kcal son opcionales.</span><button type="button" class="q danger removeMeal">Eliminar</button></div>'+
  '</div>'
}
function mealsSummaryHTML(e){
  var pc=mealProtein(e),kc=mealCalories(e),cnt=mealCount(e);
  return '<div class="mealTotal"><div class="row"><div><span class="mini muted">COMIDAS REGISTRADAS</span><b style="display:block">'+cnt+'</b></div><div style="text-align:right"><span class="mini muted">TOTAL DEL DÍA</span><b style="display:block">'+f(pc,0)+' g proteína'+(kc?' · '+f(kc,0)+' kcal':'')+'</b></div></div></div>'
}

function todayBlock(){
  var x=p(),e=todayEntry(),done=0;
  if(e&&e.steps!=null&&e.steps>=x.steps)done++;
  if(e&&e.sleep!=null&&e.sleep>=x.sleepGoal)done++;
  if(e&&mealProtein(e)>=x.protein)done++;
  if(e&&e.training&&e.training!=="No")done++;
  return '<h2 class="sec">Hoy</h2><section class="card">'+
    '<div class="row"><div><div class="ey">'+localDate()+'</div><b>Progreso diario</b></div><span class="badge">'+done+'/4 objetivos</span></div>'+
    goalRow("🚶","Pasos",e&&e.steps,x.steps,"pasos")+
    goalRow("😴","Sueño",e&&e.sleep,x.sleepGoal,"h")+
    '<div class="dailyRow"><div class="dailyTop"><span>🍽️ Comidas</span><span class="dailyVal">'+(e&&mealCount(e)?mealCount(e)+' registradas':'Pendiente')+'</span></div></div>'+
    goalRow("🥤","Proteína",e?mealProtein(e):null,x.protein,"g")+
    '<div class="dailyRow"><div class="dailyTop"><span>🏋️ Entrenamiento</span><span class="dailyVal '+(e&&e.training&&e.training!=="No"?'ok':'')+'">'+(e&&e.training?e.training:'Pendiente')+'</span></div></div>'+
    '<div class="row" style="margin-top:12px"><span class="mini muted">'+(e?'Registro de hoy activo':'Aún no hay registro de hoy')+'</span><button id="goLog" class="btn">Completar día</button></div>'+
  '</section>'
}
function recentEntries(){
  var out=[],map={};es().forEach(function(e){map[e.date]=e});
  for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");out.push({date:k,e:map[k]||null})}
  return out
}
function weekBlock(){
  var x=p(),r=recentEntries(),withSteps=r.filter(function(z){return z.e&&z.e.steps!=null}),avgSteps=withSteps.length?Math.round(withSteps.reduce(function(a,z){return a+Number(z.e.steps)},0)/withSteps.length):0;
  var sleepDays=r.filter(function(z){return z.e&&z.e.sleep!=null&&z.e.sleep>=x.sleepGoal}).length;
  var proteinDays=r.filter(function(z){return z.e&&mealProtein(z.e)>=x.protein}).length;
  var trainings=r.filter(function(z){return z.e&&z.e.training&&z.e.training!=="No"}).length;
  return '<h2 class="sec">Últimos 7 días</h2><section class="card"><div class="grid">'+
    '<div class="metric"><span class="mini muted">PASOS MEDIOS</span><b>'+avgSteps+'</b></div>'+
    '<div class="metric"><span class="mini muted">SUEÑO OBJETIVO</span><b>'+sleepDays+'/7</b></div>'+
    '<div class="metric"><span class="mini muted">PROTEÍNA OBJETIVO</span><b>'+proteinDays+'/7</b></div>'+
    '<div class="metric"><span class="mini muted">ENTRENOS</span><b>'+trainings+'</b></div>'+
  '</div></section>'
}
function f(n,d){return Number(n).toFixed(d==null?1:d)}
function entryXp(e){
  if(!e||!e.date)return 0;
  var x=p(),v=10;
  if(mealCount(e)>=2)v+=5;
  if(e.steps!=null&&Number(e.steps)>=x.steps)v+=10;
  if(e.sleep!=null&&Number(e.sleep)>=x.sleepGoal)v+=10;
  if(mealProtein(e)>=x.protein)v+=15;
  if(e.training&&e.training!=="No")v+=20;
  return v
}
function xpTotal(){
  var fromDays=es().reduce(function(a,e){return a+entryXp(e)},0);
  var fromAch=achievementDefs().filter(function(a){return a.ok}).length*25;
  var fromRaid=(Number(s.raid.done)||0)*20;
  return fromDays+fromAch+fromRaid
}
function xpLevel(){
  var total=xpTotal(),per=500,level=Math.floor(total/per)+1,into=total%per;
  return {total:total,per:per,level:level,into:into,left:per-into,pct:into/per*100}
}
function recentXp(days){
  var cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-(days-1));
  return es().filter(function(e){return e.date&&new Date(e.date+"T12:00:00")>=cutoff}).reduce(function(a,e){return a+entryXp(e)},0)
}
function lost(){return Math.max(0,p().start-p().weight)}
function bossPct(){var total=p().start-p().boss;return Math.max(0,Math.min(100,(p().start-p().weight)/total*100))}
function t(msg){var x=document.getElementById("toast");x.textContent=msg;x.style.display="block";setTimeout(function(){x.style.display="none"},2200)}
function announceNew(before){var defs=achievementDefs(),now=defs.filter(function(a){return a.ok&&before.indexOf(a.id)<0});if(now.length)t("🏆 Logro desbloqueado: "+now[0].name+(now.length>1?" +"+(now.length-1):""))}
function qrow(k,label,val){var d=s.quests[s.active][k];return '<div class="quest"><div><b>'+label+'</b><div class="mini muted">'+val+' XP</div></div><button class="q '+(d?'done':'')+'" data-q="'+k+'">'+(d?'✓ Hecho':'Marcar')+'</button></div>'}
function home(){
var x=p(),partyStart=s.profiles.aitor.start+s.profiles.laura.start,partyNow=s.profiles.aitor.weight+s.profiles.laura.weight,left=Math.max(0,x.weight-x.boss),lv=xpLevel();
return '<section class="card hero"><div class="row"><div><div class="ey">'+x.emoji+' '+x.name+' · NIVEL '+lv.level+'</div><div class="big">'+f(x.weight)+' kg</div><div class="muted">-'+f(lost())+' kg desde el inicio</div></div><span class="badge">🧪 '+lv.into+' / '+lv.per+' XP</span></div><div class="bar" style="margin-top:14px"><i style="width:'+lv.pct+'%"></i></div><div class="xpLine"><span class="mini muted">XP total: '+lv.total+'</span><b>'+lv.left+' XP para nivel '+(lv.level+1)+'</b></div></section>'+
'<h2 class="sec">Boss actual</h2><section class="card"><div class="row"><div><b>👹 Boss I · '+f(x.boss)+' kg</b><div class="mini muted">'+(left?f(left)+' kg restantes':'DERROTADO')+'</div></div><span class="badge">'+f(bossPct(),0)+'%</span></div><div class="bar" style="margin-top:12px"><i style="width:'+bossPct()+'%"></i></div></section>'+
'<h2 class="sec">Stats</h2><div class="grid">'+
'<div class="card metric"><span class="muted mini">CINTURA</span><b>'+f(x.waist,0)+' cm</b></div>'+
'<div class="card metric"><span class="muted mini">GRASA</span><b>'+f(x.fat)+'%</b></div>'+
'<div class="card metric"><span class="muted mini">MÚSCULO</span><b>'+f(x.muscle)+' kg</b></div>'+
'<div class="card metric"><span class="muted mini">VISCERAL</span><b>'+f(x.visceral,0)+'</b></div>'+
'<div class="card metric"><span class="muted mini">PROTEÍNA</span><b>'+f(x.protein,0)+' g</b></div>'+
'<div class="card metric"><span class="muted mini">PASOS</span><b>'+f(x.steps,0)+'</b></div></div>'+
todayBlock()+weekBlock()+
'<h2 class="sec">Experiencia</h2><section class="card"><div class="row"><div><b>⚔️ XP automático</b><div class="mini muted">Subes de nivel por constancia, no solo por bajar peso.</div></div><span class="badge">+'+recentXp(7)+' XP · 7 días</span></div><div style="margin-top:10px"><div class="xpSource"><span>📝 Registrar un día</span><b>+10 XP</b></div><div class="xpSource"><span>🍽️ 2+ comidas registradas</span><b>+5 XP</b></div><div class="xpSource"><span>🚶 Objetivo de pasos</span><b>+10 XP</b></div><div class="xpSource"><span>😴 Objetivo de sueño</span><b>+10 XP</b></div><div class="xpSource"><span>🥤 Objetivo de proteína</span><b>+15 XP</b></div><div class="xpSource"><span>🏋️ Entrenamiento</span><b>+20 XP</b></div><div class="xpSource"><span>🏆 Logro desbloqueado</span><b>+25 XP</b></div></div></section>'+
'<h2 class="sec">Evento</h2><section class="card"><div class="row"><div><div class="ey">🎢 RAID</div><b>PortAventura x'+s.raid.target+'</b></div><span class="badge">'+s.raid.done+'/'+s.raid.target+' días</span></div><p class="mini muted">Caminata + bocadillo completo + batido + cena proteica + hidratación.</p><div class="row"><button id="minus" class="btn alt">− Día</button><button id="plus" class="btn">+ Día completado</button></div></section>'+
'<h2 class="sec">Party</h2><section class="card"><div class="row"><div><span class="mini muted">PESO CONJUNTO</span><div class="big" style="font-size:28px">'+f(partyNow)+' kg</div></div><b>-'+f(Math.max(0,partyStart-partyNow))+' kg</b></div></section>'
}
function log(){
var x=p(),arr=es().slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,10);
var hist=arr.length?arr.map(function(e){var pc=mealProtein(e),kc=mealCalories(e),cnt=mealCount(e);return '<div class="hist"><div class="row"><b>'+e.date+'</b><b>'+(e.weight?f(e.weight)+' kg':'')+'</b></div><div class="mini muted">'+
(e.steps!=null?'🚶 '+e.steps+' pasos · ':'')+
(e.sleep!=null?'😴 '+f(e.sleep,1)+' h · ':'')+
(cnt?'🍽️ '+cnt+' comidas · ':'')+
(pc?'🥤 '+f(pc,0)+' g proteína · ':'')+
(kc?'🔥 '+f(kc,0)+' kcal · ':'')+
(e.training?'🏋️ '+e.training:'')+'</div>'+(e.notes?'<div class="mini" style="margin-top:6px">'+esc(e.notes)+'</div>':'')+'</div>'}).join(""):'<div class="card muted">Todavía no hay días registrados.</div>';
return '<h2 class="sec">Registrar día · '+x.name+'</h2><form id="form" class="card">'+
'<div class="formSection"><div class="formTitle">📅 Día</div><div class="hint">Escoge el día que quieras completar o corregir. Si ya existe, FitQuest cargará sus datos.</div>'+
field("Fecha","date","date",localDate())+'</div>'+
'<div class="formSection"><div class="formTitle">🎮 Actividad y descanso</div>'+
field("Pasos","steps","number","","","1")+
field("Sueño (horas)","sleep","number","","","0.1")+
'</div>'+
'<div class="formSection"><div class="row"><div><div class="formTitle">🍽️ Comidas</div><div class="hint">Añade lo que vayas comiendo. Proteína y kcal son opcionales.</div></div><button id="addMeal" type="button" class="btn alt">+ Añadir</button></div>'+
'<div id="meals"></div><div id="mealSummary">'+mealsSummaryHTML(null)+'</div></div>'+
'<div class="formSection"><div class="formTitle">🏋️ Estado del día</div>'+
'<div class="field"><label>Entrenamiento</label><select name="training"><option></option><option>No</option><option>Fuerza</option><option>Cardio</option><option>Mixto</option><option>PortAventura / caminata larga</option></select></div>'+

function mealDays(){return allEntries().filter(function(e){return mealCount(e)>0}).length}
function maxMeals(){return allEntries().reduce(function(m,e){return Math.max(m,mealCount(e))},0)}
function longestStreak(){
  var dates=allEntries().map(function(e){return e.date}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i});
  if(!dates.length)return 0;
  var best=1,cur=1;
  for(var i=1;i<dates.length;i++){
    var a=new Date(dates[i-1]+"T12:00:00"),b=new Date(dates[i]+"T12:00:00");
    if(Math.round((b-a)/86400000)===1){cur++;best=Math.max(best,cur)}else cur=1;
  }
  return best
}
function perfectDays(){

function importHealthFromUrl(){
  try{
    var raw=location.hash&&location.hash.indexOf("#fq=")===0?location.hash.slice(1):location.search.slice(1);
    var q=new URLSearchParams(raw);
    if(q.get("fq")!=="health")return false;
    var who=q.get("profile")==="laura"?"laura":"aitor";
    s.active=who;
    var d=new Date(),date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var rawSteps=q.get("steps"),rawSleep=q.get("sleep");
    var steps=rawSteps==null||rawSteps===""?null:Number(String(rawSteps).replace(/[^0-9]/g,""));
    var sleep=rawSleep==null||rawSleep===""?null:Number(String(rawSleep).replace(",","."));
    var arr=s.entries[who]||(s.entries[who]=[]);
    var i=arr.findIndex(function(v){return v.date===date});
    var o=i>=0?arr[i]:{date:date,weight:null,waist:null,protein:null,calories:null,meals:[],steps:null,sleep:null,hunger:null,energy:null,training:"",notes:""};
    if(Number.isFinite(steps))o.steps=Math.max(0,Math.round(steps));
    if(Number.isFinite(sleep))o.sleep=Math.max(0,Math.round(sleep*100)/100);
    if(i>=0)arr[i]=o;else arr.push(o);
    save();
    try{history.replaceState({},"",location.pathname)}catch(e){}
    return true;
  }catch(e){return false}
}
